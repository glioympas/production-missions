services:
    mysql:
        image: mysql:8.0
        container_name: outbox-mysql
        restart: unless-stopped
        ports:
            - "3306:3306"
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: outbox
            MYSQL_USER: outbox
            MYSQL_PASSWORD: secret
        volumes:
            - outbox-mysql-data:/var/lib/mysql
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
            interval: 5s
            timeout: 5s
            retries: 10

volumes:
    outbox-mysql-data:
